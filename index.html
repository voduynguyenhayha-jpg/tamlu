<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Hiện tượng Tâm lý - Cây Tri Thức</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .node-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .node-card:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 20px 35px -5px rgba(56, 189, 248, 0.6);
            border-color: #38bdf8;
            z-index: 100;
        }
        .node-label {
            transition: font-size 0.15s ease, font-weight 0.15s ease;
            white-space: normal;
            word-break: break-word;
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- Header / Hướng dẫn & Tìm kiếm -->
    <div class="absolute top-4 left-4 z-50 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-2xl max-w-sm">
        <h1 class="text-lg font-bold text-sky-400 mb-1 flex items-center gap-2">
            <span>🌳</span> Sơ Đồ Hiện Tượng Tâm Lý
        </h1>
        <p class="text-xs text-slate-300 leading-relaxed mb-3">
            • <b>Kéo chuột (Drag):</b> Di chuyển toàn cảnh.<br>
            • <b>Cuộn chuột (Scroll):</b> Phóng to / Thu nhỏ (Chữ tự rõ nét).<br>
            • <b>Click vào thẻ:</b> Xem chi tiết & ví dụ.
        </p>
        <!-- Ô tìm kiếm nhanh -->
        <div class="relative">
            <input type="text" id="search-input" placeholder="Tìm kiếm khái niệm..." oninput="handleSearch(this.value)" 
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-400 transition">
        </div>
    </div>

    <!-- Thanh công cụ điều khiển -->
    <div class="absolute bottom-4 right-4 z-50 flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-2 rounded-2xl shadow-2xl">
        <button onclick="zoomIn()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-xl transition">+</button>
        <button onclick="resetView()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl transition font-medium">Mặc định</button>
        <button onclick="zoomOut()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-xl transition">-</button>
    </div>

    <!-- Floating Tooltip khi rê chuột -->
    <div id="floating-tooltip" class="fixed z-50 pointer-events-none hidden bg-slate-900/95 border border-sky-400 p-3 rounded-xl shadow-2xl max-w-xs backdrop-blur-md transition-all duration-75">
        <span id="tooltip-category" class="text-[10px] font-semibold px-2 py-0.5 bg-sky-500/20 text-sky-300 rounded-full">Danh mục</span>
        <h4 id="tooltip-title" class="text-sm font-bold text-white mt-1.5">Tiêu đề</h4>
        <p id="tooltip-desc" class="text-xs text-slate-300 mt-1 line-clamp-3">Mô tả ngắn...</p>
    </div>

    <!-- Vùng Workspace chứa Sơ đồ 2D -->
    <div id="viewport" class="w-full h-full cursor-grab active:cursor-grabbing relative overflow-hidden">
        <div id="canvas" class="absolute top-0 left-0 w-[6000px] h-[2200px] origin-top-left">
            
            <!-- SVG Layer vẽ các đoạn thẳng nối thông tin -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="connections-svg"></svg>

            <!-- HTML Nodes Layer -->
            <div id="nodes-container" class="absolute inset-0 pointer-events-auto"></div>

        </div>
    </div>

    <!-- Modal Chi tiết Khái niệm (Khi click) -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-sky-500/50 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            <span id="modal-category" class="text-xs font-semibold px-2.5 py-1 bg-sky-500/20 text-sky-300 rounded-full">Danh mục</span>
            <h2 id="modal-title" class="text-xl font-bold text-white mt-3 mb-2">Tiêu đề khái niệm</h2>
            <p id="modal-desc" class="text-slate-300 text-sm leading-relaxed mb-4">Mô tả chi tiết...</p>
            <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-1">Ví dụ thực tế & Ý nghĩa:</span>
                <p id="modal-example" class="text-xs text-slate-300 italic leading-relaxed">Ví dụ...</p>
            </div>
        </div>
    </div>

        const nodesContainer = document.getElementById('nodes-container');
        const svgContainer = document.getElementById('connections-svg');
        const tooltip = document.getElementById('floating-tooltip');

        function renderMap(filterText = '') {
            nodesContainer.innerHTML = '';
            svgContainer.innerHTML = '';

            const lowerFilter = filterText.toLowerCase();

            // 1. Vẽ các đường nối thẳng
            treeData.forEach(node => {
                if (node.parent) {
                    const parentNode = treeData.find(p => p.id === node.parent);
                    if (parentNode) {
                        const x1 = parentNode.x + 60;
                        const y1 = parentNode.y + 25;
                        const x2 = node.x + 60;
                        const y2 = node.y + 25;

                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', x1);
                        line.setAttribute('y1', y1);
                        line.setAttribute('x2', x2);
                        line.setAttribute('y2', y2);
                        line.setAttribute('stroke', '#38bdf8');
                        line.setAttribute('stroke-width', '2');
                        line.setAttribute('stroke-opacity', '0.35');
                        line.id = `line-${node.id}-${parentNode.id}`;
                        svgContainer.appendChild(line);
                    }
                }
            });

            // 2. Vẽ các node
            treeData.forEach(node => {
                const card = document.createElement('div');
                const isMatch = filterText && node.label.toLowerCase().includes(lowerFilter);

                card.className = `node-card absolute bg-slate-900/90 border p-2 rounded-2xl shadow-lg cursor-pointer flex flex-col items-center justify-center text-center w-[125px] min-h-[50px] backdrop-blur-md`;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                if (node.level === 0) {
                    card.className += ` border-amber-500 bg-amber-950/70 shadow-amber-500/20 w-[160px] min-h-[60px]`;
                } else if (node.level === 1) {
                    card.className += ` border-sky-400 bg-sky-950/60 w-[140px] min-h-[55px]`;
                } else if (node.level === 2) {
                    card.className += ` border-indigo-500 bg-indigo-950/50`;
                } else {
                    card.className += ` border-slate-700 hover:border-sky-400 bg-slate-900/90`;
                }

                if (isMatch) {
                    card.className += ` ring-4 ring-sky-400 border-sky-400 scale-110 z-40`;
                }

                card.innerHTML = `
                    <span class="node-label text-[11px] leading-snug font-bold text-slate-100">${node.label}</span>
                `;

                card.onmouseenter = (e) => {
                    highlightConnections(node.id, true);
                    showTooltip(node, e);
                };
                card.onmouseleave = () => {
                    highlightConnections(node.id, false);
                    hideTooltip();
                };
                card.onclick = () => openModal(node);

                nodesContainer.appendChild(card);
            });

            updateFontSizes();
        }

        function updateFontSizes() {
            const labels = document.querySelectorAll('.node-label');
            let calculatedSize = Math.max(11, Math.min(26, 11 / Math.pow(scale, 0.75)));
            let fontWeight = scale < 0.4 ? '800' : (scale < 0.6 ? '700' : '600');

            labels.forEach(label => {
                label.style.fontSize = `${calculatedSize}px`;
                label.style.fontWeight = fontWeight;
            });
        }

        function showTooltip(node, e) {
            document.getElementById('tooltip-title').innerText = node.label;
            document.getElementById('tooltip-desc').innerText = node.desc;
            document.getElementById('tooltip-category').innerText = node.level === 0 ? 'Gốc hệ thống' : `Tầng phân cấp ${node.level}`;
            
            tooltip.style.left = `${e.clientX + 15}px`;
            tooltip.style.top = `${e.clientY + 15}px`;
            tooltip.classList.remove('hidden');
        }

        function hideTooltip() {
            tooltip.classList.add('hidden');
        }

        function highlightConnections(nodeId, enable) {
            treeData.forEach(node => {
                if (node.parent) {
                    const line = document.getElementById(`line-${node.id}-${node.parent}`);
                    if (line) {
                        if (node.id === nodeId || node.parent === nodeId) {
                            line.setAttribute('stroke-opacity', enable ? '1' : '0.35');
                            line.setAttribute('stroke-width', enable ? '4' : '2');
                        }
                    }
                }
            });
        }

        function handleSearch(query) {
            renderMap(query);
        }

        function openModal(node) {
            hideTooltip();
            document.getElementById('modal-title').innerText = node.label;
            document.getElementById('modal-desc').innerText = node.desc;
            document.getElementById('modal-example').innerText = node.example;
            document.getElementById('modal-category').innerText = node.level === 0 ? 'Gốc hệ thống' : `Tầng phân cấp ${node.level}`;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');

        let isDragging = false;
        let startX, startY;
        let panX = -800;
        let panY = -700;
        let scale = 0.55;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            updateFontSizes();
        }

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.node-card')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.08;
            if (e.deltaY < 0) {
                scale = Math.min(scale + zoomIntensity, 1.5);
            } else {
                scale = Math.max(scale - zoomIntensity, 0.15);
            }
            updateTransform();
        }, { passive: false });

        function zoomIn() {
            scale = Math.min(scale + 0.1, 1.5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.1, 0.15);
            updateTransform();
        }

        function resetView() {
            panX = -800;
            panY = -700;
            scale = 0.55;
            updateTransform();
        }

        // Run
        renderMap();
        updateTransform();
    </script>
</body>
</html>
