<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Phân loại Hiện tượng Tâm lý - Cây Tri Thức</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .node-card {
            transition: all 0.2s ease;
        }
        .node-card:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
            border-color: #38bdf8;
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- Header / Hướng dẫn -->
    <div class="absolute top-4 left-4 z-50 bg-slate-900/80 backdrop-blur-md border border-slate-700 p-4 rounded-xl shadow-2xl max-w-sm pointer-events-none">
        <h1 class="text-lg font-bold text-sky-400 mb-1">🌳 Bản Đồ Hiện Tượng Tâm Lý</h1>
        <p class="text-xs text-slate-300 leading-relaxed">
            • <b>Kéo chuột (Drag):</b> Di chuyển vùng nhìn.<br>
            • <b>Cuộn chuột (Scroll):</b> Phóng to / Thu nhỏ.<br>
            • <b>Click vào thẻ:</b> Xem định nghĩa & ví dụ chi tiết.
        </p>
    </div>

    <!-- Thanh công cụ điều khiển -->
    <div class="absolute bottom-4 right-4 z-50 flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-700 p-2 rounded-xl shadow-2xl">
        <button onclick="zoomIn()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-lg transition">+</button>
        <button onclick="resetView()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition">Mặc định</button>
        <button onclick="zoomOut()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-lg transition">-</button>
    </div>

    <!-- Vùng Workspace chứa Sơ đồ 2D -->
    <div id="viewport" class="w-full h-full cursor-grab active:cursor-grabbing relative overflow-hidden">
        <div id="canvas" class="absolute top-0 left-0 w-[2400px] h-[1400px] origin-top-left">
            
            <!-- SVG Layer vẽ các đoạn thẳng nối thông tin -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="connections-svg">
                <!-- Các đường thẳng nối sẽ được render tự động qua JavaScript -->
            </svg>

            <!-- HTML Nodes Layer -->
            <div id="nodes-container" class="absolute inset-0 pointer-events-auto"></div>

        </div>
    </div>

    <!-- Modal Chi tiết Khái niệm -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-sky-500/50 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <span id="modal-category" class="text-xs font-semibold px-2.5 py-1 bg-sky-500/20 text-sky-300 rounded-full">Phân loại</span>
            <h2 id="modal-title" class="text-xl font-bold text-white mt-3 mb-2">Tiêu đề khái niệm</h2>
            <p id="modal-desc" class="text-slate-300 text-sm leading-relaxed mb-4">Mô tả chi tiết...</p>
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-1">Ví dụ thực tế & Ý nghĩa nền:</span>
                <p id="modal-example" class="text-xs text-slate-300 italic">Ví dụ...</p>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu cấu trúc cây gia phả tâm lý học (Từ thấp lên cao)
        const treeData = [
            // Gốc (Thấp nhất)
            { id: 'root', label: 'HIỆN TƯỢNG TÂM LÝ', level: 0, x: 1100, y: 1150, parent: null, desc: 'Tổng hợp toàn bộ các hoạt động, trạng thái và thuộc tính tinh thần diễn ra trong não bộ con người.', example: 'Nền tảng cốt lõi của mọi khoa học hành vi và nhận thức.' },

            // Tầng 1: Các tiêu chí phân loại
            { id: 't_time', label: '1. Theo thời gian tồn tại', level: 1, x: 350, y: 850, parent: 'root', desc: 'Phân loại dựa trên tính ổn định và thời gian diễn ra của hiện tượng tâm lý trong đời sống tinh thần.', example: 'Giúp phân biệt giữa phản ứng tức thời và đặc điểm bền vững.' },
            { id: 't_con', label: '2. Theo ý thức', level: 1, x: 800, y: 850, parent: 'root', desc: 'Phân loại dựa vào mức độ nhận biết và kiểm soát của lý trí.', example: 'Đánh giá mức độ chủ động của hành vi cá nhân.' },
            { id: 't_act', label: '3. Theo hoạt động', level: 1, x: 1250, y: 850, parent: 'root', desc: 'Phân loại dựa trên trạng thái biểu hiện thành hành động cụ thể hay tiềm ẩn bên trong.', example: 'Phân biệt hiện tượng đang bộc lộ và hiện tượng dự trữ.' },
            { id: 't_soc', label: '4. Cá nhân & Xã hội', level: 1, x: 1850, y: 850, parent: 'root', desc: 'Phân loại dựa trên chủ thể mang hiện tượng tâm lý là một cá nhân độc lập hay cộng đồng xã hội.', example: 'Kết nối tâm lý học cá nhân với tâm lý học xã hội và văn hóa.' },

            // Tầng 2: Chi tiết thuộc Tầng 1
            // Theo thời gian tồn tại
            { id: 'n_qt', label: 'Quá trình tâm lý', level: 2, x: 150, y: 550, parent: 't_time', desc: 'Có mở đầu, diễn biến và kết thúc rõ ràng, thường gắn liền với sự phản ánh đối tượng.', example: 'Quá trình nhận thức (cảm giác, tri giác), quá trình cảm xúc, quá trình ý chí.' },
            { id: 'n_tt', label: 'Trạng thái tâm lý', level: 2, x: 350, y: 550, parent: 't_time', desc: 'Làm nền cho các quá trình tâm lý, ổn định hơn quá trình nhưng kém ổn định hơn thuộc tính.', example: 'Tâm trạng vui vẻ, sự chú ý, sự mệt mỏi trong một khoảng thời gian.' },
            { id: 'n_th', label: 'Thuộc tính tâm lý', level: 2, x: 550, y: 550, parent: 't_time', desc: 'Các nét tâm lý rất ổn định, khó hình thành và khó mất đi, cấu thành nhân cách cá nhân.', example: 'Xu hướng, tính cách, năng lực, khí chất của mỗi người.' },

            // Theo ý thức
            { id: 'n_c1', label: 'Có ý thức', level: 2, x: 700, y: 550, parent: 't_con', desc: 'Hiện tượng tâm lý mà con người nhận thức rõ ràng, làm chủ và điều khiển được hành vi của mình.', example: 'Học bài, giải toán, suy nghĩ có chủ định.' },
            { id: 'n_c2', label: 'Chưa có ý thức', level: 2, x: 900, y: 550, parent: 't_con', desc: 'Hiện tượng diễn ra ở tầng vô thức, tiềm thức, cá nhân chưa kịp nhận ra hoặc không kiểm soát hoàn toàn.', example: 'Hành vi bản năng, thói quen lặp lại tự động, ẩn ức.' },

            // Theo hoạt động
            { id: 'n_a1', label: 'Sống động', level: 2, x: 1150, y: 550, parent: 't_act', desc: 'Đang trực tiếp diễn ra, bộc lộ mạnh mẽ trong hoạt động thực tiễn hiện tại.', example: 'Phản ứng tức giận khi gặp chuyện bất bình, tư duy giải quyết tình huống.' },
            { id: 'n_a2', label: 'Tiềm tàng', level: 2, x: 1350, y: 550, parent: 't_act', desc: 'Tồn tại dưới dạng tiềm năng, chưa bộc lộ ngay nhưng sẽ chuyển hóa thành hành động khi có kích thích phù hợp.', example: 'Kiến thức đã học nhưng đang cất giấu trong trí nhớ dài hạn chưa cần dùng tới.' },

            // Cá nhân & Xã hội (7 hiện tượng xã hội)
            { id: 's_1', label: 'Phong tục', level: 2, x: 1500, y: 550, parent: 't_soc', desc: 'Thói quen lâu đời đã thành nếp, được cộng đồng thừa nhận và tuân theo từ thế hệ này sang thế hệ khác.', example: 'Phong tục gói bánh chưng ngày Tết.' },
            { id: 's_2', label: 'Tập quán', level: 2, x: 1590, y: 550, parent: 't_soc', desc: 'Những hành vi quen thuộc trong sinh hoạt hàng ngày mang tính địa phương hoặc nhóm.', example: 'Thói quen uống trà buổi sáng của người lớn tuổi.' },
            { id: 's_3', label: 'Định kiến', level: 2, x: 1680, y: 550, parent: 't_soc', desc: 'Thái độ đánh giá cứng nhắc, phiến diện dựa trên định hình sẵn về một nhóm người hoặc sự việc.', example: 'Định kiến giới tính trong công việc lãnh đạo.' },
            { id: 's_4', label: 'Tin đồn', level: 2, x: 1770, y: 550, parent: 't_soc', desc: 'Thông tin chưa được kiểm chứng lan truyền nhanh chóng trong xã hội.', example: 'Tin đồn thất thiệt về giá cả thị trường.' },
            { id: 's_5', label: 'Dư luận xã hội', level: 2, x: 1860, y: 550, parent: 't_soc', desc: 'Luồng ý kiến chung của đông đảo công chúng thể hiện thái độ đánh giá đối với các vấn đề chung.', example: 'Dư luận lên án hành vi xả rác bừa bãi nơi công cộng.' },
            { id: 's_6', label: 'Tâm trạng xã hội', level: 2, x: 1950, y: 550, parent: 't_soc', desc: 'Sắc thái cảm xúc chung bao trùm một cộng đồng rộng lớn trong một thời kỳ nhất định.', example: 'Tâm trạng phấn khởi dịp đầu năm mới hoặc lo âu mùa dịch bệnh.' },
            { id: 's_7', label: '"Mốt"', level: 2, x: 2040, y: 550, parent: 't_soc', desc: 'Sự ưa chuộng nhất thời đối với một kiểu dáng, phong cách ứng xử hay tiêu dùng trong xã hội.', example: 'Xu hướng thời trang hoặc phong cách sống thịnh hành trên mạng xã hội.' }
        ];

        // Khởi tạo vị trí và render giao diện
        const nodesContainer = document.getElementById('nodes-container');
        const svgContainer = document.getElementById('connections-svg');

        function renderMap() {
            nodesContainer.innerHTML = '';
            svgContainer.innerHTML = '';

            // 1. Vẽ các đoạn thẳng kết nối (Straight Lines)
            treeData.forEach(node => {
                if (node.parent) {
                    const parentNode = treeData.find(p => p.id === node.parent);
                    if (parentNode) {
                        // Tính toán tọa độ tâm node (Giả định kích thước node card: rộng 140px, cao 60px)
                        const x1 = parentNode.x + 70;
                        const y1 = parentNode.y + 30;
                        const x2 = node.x + 70;
                        const y2 = node.y + 30;

                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', x1);
                        line.setAttribute('y1', y1);
                        line.setAttribute('x2', x2);
                        line.setAttribute('y2', y2);
                        line.setAttribute('stroke', '#38bdf8');
                        line.setAttribute('stroke-width', '2');
                        line.setAttribute('stroke-opacity', '0.4');
                        svgContainer.appendChild(line);
                    }
                }
            });

            // 2. Vẽ các thẻ node hiển thị thông tin
            treeData.forEach(node => {
                const card = document.createElement('div');
                card.className = `node-card absolute bg-slate-900/90 border border-slate-700 p-3 rounded-xl shadow-lg cursor-pointer flex flex-col items-center justify-center text-center w-[140px] h-[60px] backdrop-blur-sm`;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;
                
                // Màu sắc phân biệt các tầng (Cây gia phả)
                if (node.level === 0) {
                    card.className += ` border-amber-500 bg-amber-950/40 shadow-amber-500/20`;
                } else if (node.level === 1) {
                    card.className += ` border-sky-500 bg-sky-950/40`;
                } else {
                    card.className += ` border-slate-600 hover:border-sky-400`;
                }

                card.innerHTML = `
                    <span class="text-xs font-bold text-slate-100 line-clamp-2">${node.label}</span>
                `;

                card.onclick = () => openModal(node);
                nodesContainer.appendChild(card);
            });
        }

        // Xử lý Modal hiển thị chi tiết
        function openModal(node) {
            document.getElementById('modal-title').innerText = node.label;
            document.getElementById('modal-desc').innerText = node.desc;
            document.getElementById('modal-example').innerText = node.example;
            document.getElementById('modal-category').innerText = node.level === 0 ? 'Gốc hệ thống' : `Tầng phân loại cấp ${node.level}`;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        // Tương tác Kéo thả (Pan) & Phóng to thu nhỏ (Zoom)
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');

        let isDragging = false;
        let startX, startY;
        let panX = -350;
        let panY = -150;
        let scale = 0.8;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.node-card')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            if (e.deltaY < 0) {
                scale = Math.min(scale + zoomIntensity, 2.0);
            } else {
                scale = Math.max(scale - zoomIntensity, 0.4);
            }
            updateTransform();
        }, { passive: false });

        function zoomIn() {
            scale = Math.min(scale + 0.15, 2.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.15, 0.4);
            updateTransform();
        }

        function resetView() {
            panX = -350;
            panY = -150;
            scale = 0.8;
            updateTransform();
        }

        // Khởi chạy khi tải trang
        renderMap();
        updateTransform();
    </script>
</body>
</html>
