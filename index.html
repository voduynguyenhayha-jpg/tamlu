<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Phân loại Hiện tượng Tâm lý - Cây Tri Thức</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .node-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .node-card:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.5);
            border-color: #38bdf8;
            z-index: 100;
        }
        /* Custom Scrollbar cho modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- Header / Hướng dẫn & Tìm kiếm -->
    <div class="absolute top-4 left-4 z-50 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-2xl max-w-sm">
        <h1 class="text-lg font-bold text-sky-400 mb-1 flex items-center gap-2">
            <span>🌳</span> Bản Đồ Phân Loại Tâm Lý
        </h1>
        <p class="text-xs text-slate-300 leading-relaxed mb-3">
            • <b>Kéo chuột (Drag):</b> Di chuyển vùng nhìn.<br>
            • <b>Cuộn chuột (Scroll):</b> Phóng to / Thu nhỏ.<br>
            • <b>Click vào thẻ:</b> Xem định nghĩa & ví dụ chi tiết.
        </p>
        <!-- Ô tìm kiếm nhanh -->
        <div class="relative">
            <input type="text" id="search-input" placeholder="Tìm kiếm khái niệm..." oninput="handleSearch(this.value)" 
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-400 transition">
        </div>
    </div>

    <!-- Thanh công cụ điều khiển -->
    <div class="absolute bottom-4 right-4 z-50 flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-2 rounded-2xl shadow-2xl">
        <button onclick="zoomIn()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-xl transition">+</button>
        <button onclick="resetView()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl transition font-medium">Mặc định</button>
        <button onclick="zoomOut()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold rounded-xl transition">-</button>
    </div>

    <!-- Vùng Workspace chứa Sơ đồ 2D -->
    <div id="viewport" class="w-full h-full cursor-grab active:cursor-grabbing relative overflow-hidden">
        <div id="canvas" class="absolute top-0 left-0 w-[5600px] h-[2000px] origin-top-left">
            
            <!-- SVG Layer vẽ các đoạn thẳng nối thông tin -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="connections-svg">
                <!-- Các đường thẳng nối render tự động -->
            </svg>

            <!-- HTML Nodes Layer -->
            <div id="nodes-container" class="absolute inset-0 pointer-events-auto"></div>

        </div>
    </div>

    <!-- Modal Chi tiết Khái niệm -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-sky-500/50 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            <span id="modal-category" class="text-xs font-semibold px-2.5 py-1 bg-sky-500/20 text-sky-300 rounded-full">Phân loại</span>
            <h2 id="modal-title" class="text-xl font-bold text-white mt-3 mb-2">Tiêu đề khái niệm</h2>
            <p id="modal-desc" class="text-slate-300 text-sm leading-relaxed mb-4">Mô tả chi tiết...</p>
            <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-1">Ví dụ thực tế & Ý nghĩa:</span>
                <p id="modal-example" class="text-xs text-slate-300 italic leading-relaxed">Ví dụ...</p>
            </div>
        </div>
    </div>

        // Khởi tạo render giao diện
        const nodesContainer = document.getElementById('nodes-container');
        const svgContainer = document.getElementById('connections-svg');

        let activeNodeId = null;

        function renderMap(filterText = '') {
            nodesContainer.innerHTML = '';
            svgContainer.innerHTML = '';

            const lowerFilter = filterText.toLowerCase();

            // 1. Vẽ các đoạn thẳng kết nối (Straight Lines)
            treeData.forEach(node => {
                if (node.parent) {
                    const parentNode = treeData.find(p => p.id === node.parent);
                    if (parentNode) {
                        const x1 = parentNode.x + 70;
                        const y1 = parentNode.y + 30;
                        const x2 = node.x + 70;
                        const y2 = node.y + 30;

                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', x1);
                        line.setAttribute('y1', y1);
                        line.setAttribute('x2', x2);
                        line.setAttribute('y2', y2);
                        line.setAttribute('stroke', '#38bdf8');
                        line.setAttribute('stroke-width', '2');
                        line.setAttribute('stroke-opacity', '0.3');
                        line.id = `line-${node.id}-${parentNode.id}`;
                        svgContainer.appendChild(line);
                    }
                }
            });

            // 2. Vẽ các thẻ node
            treeData.forEach(node => {
                const card = document.createElement('div');
                const isMatch = filterText && node.label.toLowerCase().includes(lowerFilter);

                card.className = `node-card absolute bg-slate-900/90 border p-3 rounded-2xl shadow-lg cursor-pointer flex flex-col items-center justify-center text-center w-[140px] h-[60px] backdrop-blur-md`;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;

                // Màu sắc phân tầng
                if (node.level === 0) {
                    card.className += ` border-amber-500 bg-amber-950/50 shadow-amber-500/20`;
                } else if (node.level === 1) {
                    card.className += ` border-sky-500 bg-sky-950/40`;
                } else if (node.level === 2) {
                    card.className += ` border-indigo-500 bg-indigo-950/30`;
                } else {
                    card.className += ` border-slate-700 hover:border-sky-400`;
                }

                if (isMatch) {
                    card.className += ` ring-4 ring-sky-400 border-sky-400 scale-105 z-40`;
                }

                card.innerHTML = `
                    <span class="text-xs font-bold text-slate-100 line-clamp-2">${node.label}</span>
                `;

                // Hiệu ứng hover làm sáng đường nối
                card.onmouseenter = () => highlightConnections(node.id, true);
                card.onmouseleave = () => highlightConnections(node.id, false);

                card.onclick = () => openModal(node);
                nodesContainer.appendChild(card);
            });
        }

        // Làm sáng đường nối khi hover node
        function highlightConnections(nodeId, enable) {
            treeData.forEach(node => {
                if (node.parent) {
                    const line = document.getElementById(`line-${node.id}-${node.parent}`);
                    if (line) {
                        if (node.id === nodeId || node.parent === nodeId) {
                            line.setAttribute('stroke-opacity', enable ? '1' : '0.3');
                            line.setAttribute('stroke-width', enable ? '4' : '2');
                            line.setAttribute('stroke', enable ? '#38bdf8' : '#38bdf8');
                        }
                    }
                }
            });
        }

        // Tìm kiếm nhanh
        function handleSearch(query) {
            renderMap(query);
        }

        // Modal xử lý chi tiết
        function openModal(node) {
            document.getElementById('modal-title').innerText = node.label;
            document.getElementById('modal-desc').innerText = node.desc;
            document.getElementById('modal-example').innerText = node.example;
            document.getElementById('modal-category').innerText = node.level === 0 ? 'Gốc hệ thống' : `Phân loại cấp ${node.level}`;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        // Tương tác Kéo thả (Pan) & Phóng to thu nhỏ (Zoom)
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');

        let isDragging = false;
        let startX, startY;
        let panX = -2300;
        let panY = -800;
        let scale = 0.55;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.node-card')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.08;
            if (e.deltaY < 0) {
                scale = Math.min(scale + zoomIntensity, 1.5);
            } else {
                scale = Math.max(scale - zoomIntensity, 0.25);
            }
            updateTransform();
        }, { passive: false });

        function zoomIn() {
            scale = Math.min(scale + 0.1, 1.5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.1, 0.25);
            updateTransform();
        }

        function resetView() {
            panX = -2300;
            panY = -800;
            scale = 0.55;
            updateTransform();
        }

        // Khởi chạy khi tải trang
        renderMap();
        updateTransform();
    </script>
</body>
</html>
